<!-- public/admin/index.html -->
<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bridal Room Atherstone — Studio Management Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --tbr-sage: #2D4A3E;
      --tbr-dark-sage: #172420;
      --tbr-ivory: #FAF8F5;
      --tbr-border: #E2DBD2;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-color: var(--tbr-ivory) !important;
      font-family: 'Jost', -apple-system, sans-serif !important;
      color: #262928 !important;
    }

    #nc-root {
      width: 100% !important;
      min-height: 100% !important;
    }

    /* Center Login Screen Card */
    section[class*="StyledAuthenticationPage"],
    section.exus10f5 {
      background-color: #FFFFFF !important;
      border: 1px solid var(--tbr-border) !important;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.06) !important;
      border-radius: 3px !important;
      max-width: 440px !important;
      width: 90% !important;
      margin: 15vh auto !important;
      padding: 45px 36px !important;
      box-sizing: border-box !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
    }

    /* Hide Default Decap Pink Logo */
    span[class*="IconWrapper-DecapLogoIcon"],
    span.exus10f3 {
      display: none !important;
    }

    /* Luxury Branded Login Header */
    .tbr-login-header {
      width: 100%;
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #EEE8E0;
    }
    .tbr-login-brand {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 26px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--tbr-dark-sage);
      margin: 0 0 6px 0;
      font-weight: 400;
      line-height: 1.1;
    }
    .tbr-login-subtitle {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #7D8582;
      display: block;
      margin-bottom: 8px;
    }
    .tbr-login-hint {
      font-size: 11px;
      color: #555E5A;
      font-weight: 300;
      line-height: 1.5;
      margin: 0;
    }

    /* Styled Login Button */
    button[class*="LoginButton"],
    button.exus10f1 {
      width: 100% !important;
      background-color: var(--tbr-dark-sage) !important;
      color: #FFFFFF !important;
      font-family: 'Jost', sans-serif !important;
      font-size: 0 !important;
      padding: 15px 24px !important;
      border-radius: 2px !important;
      border: none !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
      cursor: pointer !important;
      transition: background-color 0.2s ease !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box !important;
    }

    button[class*="LoginButton"]:hover,
    button.exus10f1:hover {
      background-color: var(--tbr-sage) !important;
    }

    button[class*="LoginButton"] span[class*="IconWrapper-LoginButtonIcon"],
    button.exus10f1 span {
      display: none !important;
    }

    button[class*="LoginButton"]::after,
    button.exus10f1::after {
      content: "Sign In to Studio Portal" !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      letter-spacing: 0.22em !important;
      text-transform: uppercase !important;
      color: #FFFFFF !important;
    }

    /* Dashboard Header */
    header[class*="AppHeader"] {
      background-color: #FFFFFF !important;
      border-bottom: 1px solid var(--tbr-border) !important;
    }
  </style>
</head>
<body>
  <div id="nc-root"></div>
  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>

  <script>
    // 1. Injects the branded header on the login screen
    const observer = new MutationObserver(() => {
      const container = document.querySelector('section[class*="StyledAuthenticationPage"], section.exus10f5');
      if (container && !document.getElementById('tbr-login-injected')) {
        const headerEl = document.createElement('div');
        headerEl.id = 'tbr-login-injected';
        headerEl.className = 'tbr-login-header';
        headerEl.innerHTML = `
          <h1 class="tbr-login-brand">The Bridal Room</h1>
          <span class="tbr-login-subtitle">Atherstone &bull; Studio Management Portal</span>
          <p class="tbr-login-hint">Authorized access for Vicky & Samantha to manage dresses, appointment notes, and boutique hours.</p>
        `;
        container.insertBefore(headerEl, container.firstChild);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 2. Registers custom 'combobox' widget (Single-select dropdown OR type custom text)
    if (window.CMS && window.createClass && window.h) {
      const ComboboxControl = window.createClass({
        handleChange: function(e) {
          this.props.onChange(e.target.value);
        },
        render: function() {
          const listId = this.props.forID + '_datalist';
          const rawOptions = this.props.field.get('options');
          const options = rawOptions ? rawOptions.toJS() : [];

          return window.h('div', { style: { width: '100%' } }, [
            window.h('input', {
              id: this.props.forID,
              className: this.props.classNameWrapper,
              type: 'text',
              list: listId,
              value: this.props.value || '',
              onChange: this.handleChange,
              placeholder: this.props.field.get('hint') || 'Choose from list or type custom...',
              style: {
                width: '100%',
                padding: '10px 14px',
                fontSize: '14px',
                border: '1px solid #D5CFC7',
                borderRadius: '2px',
                boxSizing: 'border-box'
              }
            }),
            window.h('datalist', { id: listId },
              options.map(function(opt) {
                return window.h('option', { value: opt, key: opt });
              })
            )
          ]);
        }
      });
      window.CMS.registerWidget('combobox', ComboboxControl);

      // 3. Registers custom 'tags' widget (Multiple chips + Type custom + Quick-add presets)
      const TagsControl = window.createClass({
        getInitialState: function() {
          return { inputValue: '' };
        },
        handleChange: function(e) {
          this.setState({ inputValue: e.target.value });
        },
        handleKeyDown: function(e) {
          if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault();
            this.addTag(this.state.inputValue);
          }
        },
        addTag: function(tagText) {
          const trimmed = (tagText || '').trim();
          if (!trimmed) return;
          const rawVal = this.props.value;
          let currentTags = [];
          if (rawVal) {
            currentTags = Array.isArray(rawVal) ? rawVal.slice() : (rawVal.toJS ? rawVal.toJS() : []);
          }
          if (!currentTags.includes(trimmed)) {
            const nextTags = currentTags.concat([trimmed]);
            this.props.onChange(nextTags);
          }
          this.setState({ inputValue: '' });
        },
        removeTag: function(tagToRemove) {
          const rawVal = this.props.value;
          let currentTags = [];
          if (rawVal) {
            currentTags = Array.isArray(rawVal) ? rawVal.slice() : (rawVal.toJS ? rawVal.toJS() : []);
          }
          const nextTags = currentTags.filter(function(t) { return t !== tagToRemove; });
          this.props.onChange(nextTags);
        },
        render: function() {
          const rawVal = this.props.value;
          let currentTags = [];
          if (rawVal) {
            currentTags = Array.isArray(rawVal) ? rawVal : (rawVal.toJS ? rawVal.toJS() : []);
          }

          const rawOptions = this.props.field.get('options');
          const presets = rawOptions ? (rawOptions.toJS ? rawOptions.toJS() : rawOptions) : [];
          const self = this;

          // Selected Tag Badges
          const chips = currentTags.map(function(tag) {
            return window.h('span', {
              key: tag,
              style: {
                display: 'inline-flex',
                alignItems: 'center',
                gap: '6px',
                background: '#2D4A3E',
                color: '#FFFFFF',
                padding: '4px 10px',
                borderRadius: '2px',
                fontSize: '11px',
                marginRight: '6px',
                marginBottom: '6px',
                letterSpacing: '0.05em'
              }
            }, [
              tag,
              window.h('button', {
                type: 'button',
                style: {
                  background: 'none',
                  border: 'none',
                  color: '#FFFFFF',
                  cursor: 'pointer',
                  fontWeight: 'bold',
                  padding: '0 2px',
                  fontSize: '14px',
                  lineHeight: '1'
                },
                onClick: function() { self.removeTag(tag); }
              }, '×')
            ]);
          });

          // Text Input + Add Button
          const inputRow = window.h('div', {
            style: { display: 'flex', gap: '8px', marginTop: '8px' }
          }, [
            window.h('input', {
              type: 'text',
              value: this.state.inputValue,
              onChange: this.handleChange,
              onKeyDown: this.handleKeyDown,
              placeholder: this.props.field.get('hint') || 'Type any custom detail & press Enter...',
              style: {
                flex: '1',
                padding: '9px 12px',
                fontSize: '13px',
                border: '1px solid #D5CFC7',
                borderRadius: '2px',
                outline: 'none',
                background: '#FFFFFF'
              }
            }),
            window.h('button', {
              type: 'button',
              onClick: function() { self.addTag(self.state.inputValue); },
              style: {
                background: '#172420',
                color: '#FFFFFF',
                border: 'none',
                padding: '8px 16px',
                borderRadius: '2px',
                fontSize: '11px',
                textTransform: 'uppercase',
                letterSpacing: '0.15em',
                cursor: 'pointer'
              }
            }, '+ Add')
          ]);

          // Preset Quick-Picks
          const presetPills = presets.map(function(opt) {
            const isSelected = currentTags.includes(opt);
            return window.h('button', {
              key: opt,
              type: 'button',
              disabled: isSelected,
              onClick: function() { self.addTag(opt); },
              style: {
                display: 'inline-block',
                margin: '3px 4px 3px 0',
                padding: '4px 8px',
                fontSize: '11px',
                borderRadius: '2px',
                border: '1px solid ' + (isSelected ? '#E2DBD2' : '#CBD5E1'),
                background: isSelected ? '#F1F5F9' : '#FFFFFF',
                color: isSelected ? '#94A3B8' : '#334155',
                cursor: isSelected ? 'default' : 'pointer'
              }
            }, (isSelected ? '✓ ' : '+ ') + opt);
          });

          const presetSection = presets.length > 0 ? window.h('div', {
            style: { marginTop: '12px', paddingTop: '10px', borderTop: '1px dashed #E2DBD2' }
          }, [
            window.h('div', {
              style: { fontSize: '10px', textTransform: 'uppercase', letterSpacing: '0.15em', color: '#64748B', marginBottom: '6px' }
            }, 'Quick-Add Common Bridal Features:'),
            window.h('div', {}, presetPills)
          ]) : null;

          return window.h('div', {
            style: {
              width: '100%',
              padding: '12px',
              background: '#FAF8F5',
              border: '1px solid #E2DBD2',
              borderRadius: '2px',
              boxSizing: 'border-box'
            }
          }, [
            window.h('div', {}, chips.length > 0 ? chips : [
              window.h('span', { style: { fontSize: '11px', color: '#94A3B8', fontStyle: 'italic' } }, 'No features selected yet.')
            ]),
            inputRow,
            presetSection
          ]);
        }
      });
      window.CMS.registerWidget('tags', TagsControl);
    }
  </script>
</body>
</html>
