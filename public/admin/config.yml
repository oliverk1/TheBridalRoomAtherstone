# public/admin/config.yml

local_backend: true

backend:
  name: github
  repo: oliverk1/TheBridalRoomAtherstone
  branch: main
  base_url: https://tbr-decap-auth.oking574.workers.dev
  auth_endpoint: auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # =========================================================================
  # 1. DRESSES COLLECTION (Combobox widgets allow picking or typing custom)
  # =========================================================================
  - name: "dresses"
    label: "Dresses & Gowns"
    folder: "src/content/dresses"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Dress Title", name: "title", widget: "string", hint: "e.g. Romantic Beaded Mikado" }

      # Designer: Pick from common designers OR type any new designer name
      - label: "Designer"
        name: "designer"
        widget: "combobox"
        options:
          - "Justin Alexander"
          - "Sincerity Bridal"
          - "Adore by Justin Alexander"
          - "Phoenix Gowns"
          - "Danielle Couture"
        hint: "Pick a designer or type a new brand name"

      - label: "Rail / Purchase Type"
        name: "category"
        widget: "select"
        options:
          - "Made to Order (£1,200 - £2,500)"
          - "Sample Sale Rail (£250 - £900)"
          - "Accessories"

      - { label: "Price / Price Tag", name: "price", widget: "string", hint: "e.g. £1,650 or Sample £695 (RRP £1,450)" }

      - label: "In-Store Sample Size"
        name: "sampleSize"
        widget: "select"
        default: "14"
        options: ["10", "12", "14", "16", "18", "20", "22", "24"]

      # Silhouette: Pick from standard cuts OR type any custom cut
      - label: "Silhouette / Cut"
        name: "silhouette"
        widget: "combobox"
        default: "A-Line"
        options:
          - "A-Line"
          - "Fit and Flare / Mermaid"
          - "Ballgown"
          - "Clean & Modern"
          - "Boho & Lace"
          - "Column / Sheath"
          - "Tea-Length"
        hint: "Pick a silhouette or type a custom cut"

      # Neckline: Pick from standard necklines OR type any custom neckline
      - label: "Neckline"
        name: "neckline"
        widget: "combobox"
        default: "Sweetheart"
        options:
          - "Sweetheart"
          - "V-Neck / Plunge"
          - "Square & Straight"
          - "Strapless"
          - "High Neck / Halter"
          - "Bateau / Boatneck"
          - "Off-the-Shoulder"
          - "One Shoulder"
          - "Cowl Neck"
        hint: "Pick from dropdown or type any custom neckline"

      - label: "Fabric & Feature Tags (Filter Pills)"
        name: "tags"
        widget: "list"
        default: ["Romantic Lace"]
        field: { label: "Tag", name: "tag", widget: "string" }
        hint: "Add as many feature tags as you like (e.g. Romantic Lace, Crepe, Low Back Detail, Sleeves)"

      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Main Front Photo", name: "image", widget: "image" }
      - { label: "Back View Photo (Optional)", name: "imageDetail", widget: "image", required: false }
      - label: "Additional Gallery Photos (Optional)"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }
      - { label: "Editorial Description", name: "body", widget: "markdown", required: false }

  # =========================================================================
  # 2. SITE-WIDE SETTINGS, TICKERS & FOUNDER CONTENT
  # =========================================================================
  - name: "settings"
    label: "Website Settings"
    files:
      - label: "Reassurance Ticker Points"
        name: "ticker"
        file: "src/content/settings/ticker.json"
        fields:
          - label: "Active Ticker Items"
            name: "items"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string" }

      - label: "Bride Testimonials & Quotes Ticker"
        name: "quotes"
        file: "src/content/settings/quotes.json"
        fields:
          - label: "Quotes"
            name: "quotes"
            widget: "list"
            fields:
              - { label: "Quote Text", name: "quote", widget: "text" }
              - { label: "Bride Name", name: "bride", widget: "string" }
              - { label: "Designer / Gown", name: "designer", widget: "string" }
              - { label: "Wedding Location", name: "location", widget: "string" }

      - label: "About Page Content & Founders"
        name: "about_content"
        file: "src/content/settings/about.json"
        fields:
          - label: "Hero Content"
            name: "founderHero"
            widget: "object"
            fields:
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Lead Biography", name: "lead", widget: "text" }
          - label: "Experience Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value (e.g. 29+)", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Why Choose Us Pillars"
            name: "pillars"
            widget: "list"
            fields:
              - { label: "Number (e.g. 01)", name: "number", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

      - label: "Homepage Hero Notice"
        name: "hero_notice"
        file: "src/content/settings/notice.json"
        fields:
          - { label: "Show Announcement Bar", name: "enabled", widget: "boolean", default: false }
          - { label: "Banner Text", name: "text", widget: "string" }
          - { label: "Link URL (Optional)", name: "link", widget: "string", required: false }

  # =========================================================================
  # 3. WEBSITE FAQS
  # =========================================================================
  - name: "faqs"
    label: "Website FAQs"
    files:
      - label: "Frequently Asked Questions"
        name: "all_faqs"
        file: "src/content/settings/faqs.json"
        fields:
          - label: "Homepage FAQs"
            name: "homepageFaqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
          - label: "The Experience & Fitting FAQs"
            name: "experienceFaqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
          - label: "The Dresses & Lookbook FAQs"
            name: "dressFaqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
          - label: "About Page FAQs"
            name: "aboutFaqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
          - label: "Contact & Visiting FAQs"
            name: "contactFaqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }